name: build-macos

# xhqing 自建分叉的构建流水线。
# 上游的 CI 跑在 Blacksmith 私有 runner 上，公开分叉用不了，所以我们自己写这一条：
# 只做一件事——在 GitHub 公开的 macOS 26 runner 上构建 Release 版 app，产出可安装的 zip。
#
# 用法：
#   1) 仓库 Actions 页面手动 Run workflow（tag 默认 xhqing，arch 默认 arm64）；
#   2) 或推送形如 v0.65.2.2-r13 的 tag 自动触发（按 arm64 构建）。
#
# 架构：默认只编 arm64。用户主机是 Apple Silicon，编通用二进制（arm64 + x86_64）
# 等于把整个 app 编两遍——实测一轮要 3.5 小时以上还没编完。需要 x86_64（例如装到
# macmini）时手动选 arch=x86_64 或 universal。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "构建标签：决定 app 名与 bundle id 后缀（默认 xhqing）"
        required: false
        default: xhqing
      arch:
        description: "构建架构：arm64（默认，用户本机）/ x86_64（Intel Mac、macmini）/ universal（两者合一）"
        required: false
        type: choice
        default: arm64
        options:
          - arm64
          - x86_64
          - universal
  push:
    tags:
      - "v*-r[0-9]*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release build (macos-26)
    runs-on: macos-26
    # 这个工程 2 万多个文件，公开 runner 首次全量构建很慢，给足时间。
    timeout-minutes: 360
    env:
      CMUX_DEV_BACKEND_MODE: local
      # 没有 Developer ID：让 Xcode 用 ad-hoc 身份签名（每个嵌套二进制都会签），
      # 而不是整包跳过签名后再补一刀 --deep。
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"

    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 解析构建参数
        run: |
          set -euo pipefail
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          case "${ARCH}" in
            arm64)
              echo "ARCHS=arm64" >> "$GITHUB_ENV"
              echo "ONLY_ACTIVE_ARCH=YES" >> "$GITHUB_ENV"
              ;;
            x86_64)
              echo "ARCHS=x86_64" >> "$GITHUB_ENV"
              echo "ONLY_ACTIVE_ARCH=YES" >> "$GITHUB_ENV"
              ;;
            universal)
              echo "ARCHS=arm64 x86_64" >> "$GITHUB_ENV"
              echo "ONLY_ACTIVE_ARCH=NO" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::未知架构 '${ARCH}'（只支持 arm64 / x86_64 / universal）"
              exit 1
              ;;
          esac
          # CI 不跑增量/索引，关掉编译器索引存储能省下可观的时间。
          echo "COMPILER_INDEX_STORE_ENABLE=NO" >> "$GITHUB_ENV"

          # 版本号：工程里写死的是上游的 0.65.2（12 处 MARKETING_VERSION），
          # 这里以 VERSION 为准注入。CFBundleShortVersionString 只能是纯数字段，
          # 所以去掉 "-rN" 后缀；修订后缀保留在 VERSION / tag / Release / 产物名里。
          VERSION_RAW="$(tr -d '[:space:]' < VERSION)"
          MARKETING="${VERSION_RAW%%-*}"
          if ! [[ "${MARKETING}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::VERSION 的前缀不是合法的纯数字版本号：'${VERSION_RAW}'"
            exit 1
          fi
          # 修订后缀只有一种规范写法：-r<N>（N 是本仓库在该上游基线上的修订号）。
          # 个人 handle 之类的记法一律拒掉，避免版本号不规范。
          if [[ "${VERSION_RAW}" == *-* ]]; then
            SUFFIX="${VERSION_RAW#*-}"
            if ! [[ "${SUFFIX}" =~ ^r[0-9]+$ ]]; then
              echo "::error::VERSION 的修订后缀不合法：'${SUFFIX}'（规范格式是 -r<N>，例如 0.65.2.2-r13）"
              exit 1
            fi
          fi
          echo "MARKETING_VERSION=${MARKETING}" >> "$GITHUB_ENV"
          # build number 用「UTC 日期 + run 号」，单调递增，避免反复覆盖安装时
          # 系统拿旧的 Launch Services / 图标缓存。
          echo "CURRENT_PROJECT_VERSION=$(date -u +%Y%m%d)0${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

          echo "构建架构：${ARCH}"
          echo "MARKETING_VERSION：${MARKETING}"
          echo "CURRENT_PROJECT_VERSION：$(date -u +%Y%m%d)0${GITHUB_RUN_NUMBER}"

      - name: 缓存 Zig / Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-${{ runner.os }}-${{ hashFiles('ghostty/build.zig.zon', 'Native/*/Cargo.lock', 'Packages/**/Cargo.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: 打印环境信息
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version || true
          zig version || true
          cargo --version || true
          rustup toolchain list || true

      - name: 选择 Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "::error::runner 上没有 Xcode 26，无法构建"
            exit 1
          fi
          echo "使用 ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}"
          xcodebuild -version

      - name: 安装 Metal 工具链
        run: xcodebuild -downloadComponent MetalToolchain

      - name: 安装 Zig 0.16.0（上游要求主次版本必须匹配）
        run: |
          set -euo pipefail
          ZIG_VERSION="0.16.0"
          # ghostty/build.zig.zon 里写的是 minimum_zig_version = "0.16.0"，
          # scripts/ghostty-zig-version.sh 要求主次版本完全一致，所以不能用
          # brew 的 latest（现在是 0.17.x）。
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/.local/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig" version

      - name: 检查 Go（Release 构建的 WireGuard 引擎需要）
        run: |
          if command -v go >/dev/null 2>&1; then
            go version
          else
            brew install go
            go version
          fi

      - name: setup（子模块 / Rust 工具链 / 预编译 GhosttyKit）
        run: ./scripts/setup.sh

      - name: 构建 Release（本项目正式身份）
        run: |
          set -euo pipefail
          echo "构建身份：cmux（bundle id com.xhqing.cmux）"
          # Keep the full xcodebuild output. GitHub truncates the live step log,
          # so a killed/failed build loses the real error; the artifact from the
          # next step is the only complete record.
          set -o pipefail
          ./scripts/reloads.sh --derived-data /tmp/cmux-build 2>&1 | tee /tmp/cmux-build-raw.log

      - name: 单元测试（cmuxTests，scheme cmux-unit）
        # 为什么放这里而不是 PR 门禁：cmuxTests 用 `@testable import cmux` 依赖整个
        # app target，跑它等于再走一遍完整构建（本项目实测 2~4 小时）。PR 门禁必须保持
        # 「几分钟内跑完」（见 DEVELOPMENT.md「为什么 PR 门禁是轻量门禁」），所以测试接在
        # 这个已经是长任务的 build-macos 里——tag / dispatch 触发，发版前把回归拦下来。
        # 超时给 180 分钟：`cmux-unit` 的 TestAction 是 Debug，与上面 Release 构建的配置
        # 不同，共用 derivedData 仍要整套重编，45 分钟不够（r22 即因此超时），
        # 180 分钟仍在 job 级 `timeout-minutes: 360` 之内。
        timeout-minutes: 180
        run: |
          set -euo pipefail
          xcodebuild test \
            -project cmux.xcodeproj \
            -scheme cmux-unit \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath /tmp/cmux-build \
            -only-testing:cmuxTests

      - name: 校验产物不含构建机 home 路径
        run: |
          set -euo pipefail
          # xhqing/cmux#46：reloads.sh 曾经把 "$HOME/Library/Application Support/cmux/..."
          # 写进 Info.plist 的 LSEnvironment，CI 上 $HOME=/Users/runner，绝对路径被固化
          # 进产物、装到任何用户机器上都不存在。这里对最终产物再断言一次。
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          ./scripts/check-bundle-home-paths.sh "${APP}"

      - name: 校验更新通道（feed / 公钥 / 版本）
        run: |
          set -euo pipefail
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          PLIST="${APP}/Contents/Info.plist"
          EXPECTED_FEED="https://github.com/xhqing/cmux/releases/latest/download/appcast.xml"
          # 本分叉自己的 Sparkle EdDSA 公钥；对应私钥只放在 GitHub secret
          # SPARKLE_PRIVATE_KEY 里（本机备份在 macOS 钥匙串，见 DEVELOPMENT.md 第四节）。
          EXPECTED_SPARKLE_PUBLIC_KEY="rfbvt6jmbne/wfXun8IedZrnp4hR/iRFi9oCPtKsN4Q="
          FEED="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "${PLIST}" || true)"
          AUTO="$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "${PLIST}" || true)"
          KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "${PLIST}" || true)"
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${PLIST}" || true)"
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${PLIST}" || true)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${PLIST}" || true)"
          # 我们自己的发布版本号（带 "-rN" 后缀），About 面板就显示它。
          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          ABOUT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CMUXVersion' "${PLIST}" || true)"
          echo "bundle id : ${BID}"
          echo "version   : ${VER} (build ${BUILD})"
          echo "release   : ${RELEASE_VERSION}（About 面板显示值：${ABOUT_VERSION}）"
          echo "feed      : ${FEED}"
          echo "auto check: ${AUTO}"
          echo "sparkle key: ${KEY}"
          if [ "${BID}" != "com.xhqing.cmux" ]; then
            echo "::error::CFBundleIdentifier=${BID}，应为 com.xhqing.cmux"
            exit 1
          fi
          if [ "${VER}" != "${MARKETING_VERSION}" ]; then
            echo "::error::CFBundleShortVersionString=${VER}，应为 ${MARKETING_VERSION}（VERSION 去后缀）"
            exit 1
          fi
          if [ "${ABOUT_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::CMUXVersion=${ABOUT_VERSION}，应为 ${RELEASE_VERSION}（VERSION 原值，About 面板显示的版本号）"
            exit 1
          fi
          # Sparkle 用 CFBundleVersion 比较新旧版本；CI 传的是「日期 + run 号」的单调数字，
          # 一旦退回工程里写死的 113，后续所有更新都不会被判为「更新」。
          if ! [[ "${BUILD}" =~ ^[0-9]{10,}$ ]]; then
            echo "::error::CFBundleVersion=${BUILD}，不是预期的「日期 + run 号」单调构建号（CURRENT_PROJECT_VERSION 没传进 xcodebuild？）"
            exit 1
          fi
          if [ "${FEED}" != "${EXPECTED_FEED}" ]; then
            echo "::error::SUFeedURL=${FEED}，应为 ${EXPECTED_FEED}（更新源只认本仓库，不能指向上游）"
            exit 1
          fi
          if [ "${KEY}" != "${EXPECTED_SPARKLE_PUBLIC_KEY}" ]; then
            echo "::error::SUPublicEDKey=${KEY}，应为 ${EXPECTED_SPARKLE_PUBLIC_KEY}；改了公钥必须同步 GitHub secret SPARKLE_PRIVATE_KEY，否则 appcast 签名对不上"
            exit 1
          fi
          if [ "${AUTO}" = "true" ]; then
            echo "::error::SUEnableAutomaticChecks 仍为 true"
            exit 1
          fi

      - name: 校验 bundle 主题库完整（Issue #71）
        run: |
          set -euo pipefail
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          SRC="Resources/ghostty/themes"
          BUNDLED="${APP}/Contents/Resources/ghostty/themes"
          # 主题库经 folder reference（cmux.xcodeproj 里 ghostty-themes）整目录拷进
          # bundle；这里断言拷贝结果与仓库源目录逐文件一致（数量 + 内容），防止
          # 上游同步 / 工程改动让 bundle 主题库悄悄漂移。
          if [ ! -d "${BUNDLED}" ]; then
            echo "::error::bundle 内没有主题库目录 ${BUNDLED}（folder reference 未生效？）"
            exit 1
          fi
          src_count="$(find "${SRC}" -type f | wc -l | tr -d ' ')"
          bundled_count="$(find "${BUNDLED}" -type f | wc -l | tr -d ' ')"
          echo "仓库主题文件数：${src_count}"
          echo "bundle 主题文件数：${bundled_count}"
          if [ "${src_count}" != "${bundled_count}" ]; then
            echo "::error::主题文件数量不一致：仓库 ${src_count} vs bundle ${bundled_count}"
            exit 1
          fi
          diff -r "${SRC}" "${BUNDLED}"
          echo "主题库逐文件一致 ✓"

      - name: 打包
        run: |
          set -euo pipefail
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          VERSION="$(cat VERSION)"
          # 产物名带上真实架构（从二进制里读，不猜输入参数）
          BIN="${APP}/Contents/MacOS/cmux"
          ARCHS_PRESENT="$(lipo -archs "${BIN}" 2>/dev/null | tr ' ' '-' || echo unknown)"
          echo "app 内的架构：${ARCHS_PRESENT}"
          OUT="cmux-${VERSION}-macos-${ARCHS_PRESENT}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${OUT}"
          ls -lh "${OUT}"
          shasum -a 256 "${OUT}" | tee "${OUT}.sha256"

      - name: 生成并签名 appcast（仅 tag 构建）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少 GitHub secret SPARKLE_PRIVATE_KEY，无法给 appcast 签名（app 内更新通道会断掉）"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} 与 VERSION（${VERSION}）不一致，appcast 会指向错的版本"
            exit 1
          fi
          # 先确认 secret 里的私钥与 app 里的公钥是同一对，否则生成的签名 Sparkle 会拒绝。
          EXPECTED_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' /tmp/cmux-build/Build/Products/Release/cmux.app/Contents/Info.plist)"
          DERIVED_KEY="$(swift scripts/derive_sparkle_public_key.swift "${SPARKLE_PRIVATE_KEY}")"
          if [ "${DERIVED_KEY}" != "${EXPECTED_KEY}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY 对应的公钥（${DERIVED_KEY}）与 app 的 SUPublicEDKey（${EXPECTED_KEY}）不一致"
            exit 1
          fi
          ZIP="$(find . -maxdepth 1 -name 'cmux-*.zip' -type f -print -quit)"
          if [ -z "${ZIP}" ]; then
            echo "::error::找不到要签名的 cmux-*.zip"
            exit 1
          fi
          DOWNLOAD_URL_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
          RELEASE_NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            ./scripts/sparkle_generate_appcast.sh "${ZIP}" "${TAG}" appcast.xml
          # 显示版本用 VERSION 原值（带 -rN），否则更新提示会把 r18 显示成旧基线版本号。
          python3 scripts/ci/set-appcast-version.py appcast.xml "${VERSION}"
          ls -lh appcast.xml
          grep -qF "releases/download/${TAG}/$(basename "${ZIP}")" appcast.xml

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cmux-xhqing-${{ github.run_number }}-${{ github.event.inputs.arch || 'arm64' }}
          path: |
            cmux-*.zip
            cmux-*.zip.sha256
            appcast.xml
          if-no-files-found: error
          retention-days: 30

      - name: 上传完整构建日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/cmux-build-raw.log
          if-no-files-found: warn
          retention-days: 7

      - name: 收尾（关掉构建脚本顺手拉起的实例）
        if: always()
        run: |
          pkill -f "/tmp/cmux-build/Build/Products/Release/cmux.app/Contents/MacOS/cmux" || true
          exit 0
