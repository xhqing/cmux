name: build-macos

# xhqing 自建分叉的构建流水线。
# 上游的 CI 跑在 Blacksmith 私有 runner 上，公开分叉用不了，所以我们自己写这一条：
# 只做一件事——在 GitHub 公开的 macOS 26 runner 上构建 Release 版 app，产出可安装的 zip。
#
# 用法：
#   1) 仓库 Actions 页面手动 Run workflow（tag 默认 xhqing，arch 默认 arm64）；
#   2) 或推送形如 v0.65.2.2-r13 的 tag 自动触发（按 arm64 构建）。
#
# 架构：默认只编 arm64。用户主机是 Apple Silicon，编通用二进制（arm64 + x86_64）
# 等于把整个 app 编两遍——实测一轮要 3.5 小时以上还没编完。需要 x86_64（例如装到
# macmini）时手动选 arch=x86_64 或 universal。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "构建标签：决定 app 名与 bundle id 后缀（默认 xhqing）"
        required: false
        default: xhqing
      arch:
        description: "构建架构：arm64（默认，用户本机）/ x86_64（Intel Mac、macmini）/ universal（两者合一）"
        required: false
        type: choice
        default: arm64
        options:
          - arm64
          - x86_64
          - universal
      jobs:
        description: "xcodebuild 并行编译数（默认 2）。实测 -jobs 4 反而更慢（3 核 runner），见 Issue #104"
        required: false
        default: "2"
      cache:
        description: "是否恢复 / 保存 DerivedData 缓存（默认 true）。冷缓存实验时填 false"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*-r[0-9]*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release build (macos-26)
    runs-on: macos-26
    # 这个工程 2 万多个文件，公开 runner 首次全量构建很慢，给足时间。
    timeout-minutes: 360
    env:
      CMUX_DEV_BACKEND_MODE: local
      # 没有 Developer ID：让 Xcode 用 ad-hoc 身份签名（每个嵌套二进制都会签），
      # 而不是整包跳过签名后再补一刀 --deep。
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      # 可选的固定签名证书（Issue #121）。三个 secret 都不配时下面一切照旧，产物仍是
      # ad-hoc；配了之后由「导入签名证书（可选）」那一步把 CMUX_DEV_SIGN_IDENTITY 写进
      # $GITHUB_ENV，scripts/reloads.sh 就会用这张证书签最终产物。
      # 注意 CMUX_DEV_SIGN_IDENTITY 刻意不在这里设置：没配证书时它必须是未设置状态，
      # 否则解析器会因为「指定的身份不存在」直接失败。
      CMUX_DEV_SIGNING_CERT_P12_BASE64: ${{ secrets.CMUX_DEV_SIGNING_CERT_P12_BASE64 }}
      CMUX_DEV_SIGNING_CERT_PASSWORD: ${{ secrets.CMUX_DEV_SIGNING_CERT_PASSWORD }}
      CMUX_DEV_SIGNING_IDENTITY: ${{ secrets.CMUX_DEV_SIGNING_IDENTITY }}
      # 并行编译数（Issue #104）。scripts/reloads.sh 读这个变量。
      # 实测：-jobs 2 构建 75:49，-jobs 4 构建 84:38（3 核 runner 上超过核数反而更慢），
      # 所以默认保持 2。
      CMUX_BUILD_JOBS: ${{ github.event.inputs.jobs || '2' }}

    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 解析构建参数
        run: |
          set -euo pipefail
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          case "${ARCH}" in
            arm64)
              echo "ARCHS=arm64" >> "$GITHUB_ENV"
              echo "ONLY_ACTIVE_ARCH=YES" >> "$GITHUB_ENV"
              ;;
            x86_64)
              echo "ARCHS=x86_64" >> "$GITHUB_ENV"
              echo "ONLY_ACTIVE_ARCH=YES" >> "$GITHUB_ENV"
              ;;
            universal)
              echo "ARCHS=arm64 x86_64" >> "$GITHUB_ENV"
              echo "ONLY_ACTIVE_ARCH=NO" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::未知架构 '${ARCH}'（只支持 arm64 / x86_64 / universal）"
              exit 1
              ;;
          esac
          # CI 不跑增量/索引，关掉编译器索引存储能省下可观的时间。
          echo "COMPILER_INDEX_STORE_ENABLE=NO" >> "$GITHUB_ENV"

          # 版本号：工程里写死的是上游的 0.65.2（12 处 MARKETING_VERSION），
          # 这里以 VERSION 为准注入。CFBundleShortVersionString 只能是纯数字段，
          # 所以去掉 "-rN" 后缀；修订后缀保留在 VERSION / tag / Release / 产物名里。
          VERSION_RAW="$(tr -d '[:space:]' < VERSION)"
          MARKETING="${VERSION_RAW%%-*}"
          if ! [[ "${MARKETING}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::VERSION 的前缀不是合法的纯数字版本号：'${VERSION_RAW}'"
            exit 1
          fi
          # 修订后缀只有一种规范写法：-r<N>（N 是本仓库在该上游基线上的修订号）。
          # 个人 handle 之类的记法一律拒掉，避免版本号不规范。
          if [[ "${VERSION_RAW}" == *-* ]]; then
            SUFFIX="${VERSION_RAW#*-}"
            if ! [[ "${SUFFIX}" =~ ^r[0-9]+$ ]]; then
              echo "::error::VERSION 的修订后缀不合法：'${SUFFIX}'（规范格式是 -r<N>，例如 0.65.2.2-r13）"
              exit 1
            fi
          fi
          echo "MARKETING_VERSION=${MARKETING}" >> "$GITHUB_ENV"
          # build number 用「UTC 日期 + run 号」，单调递增，避免反复覆盖安装时
          # 系统拿旧的 Launch Services / 图标缓存。
          # 构建号必须单调递增（Sparkle 用 CFBundleVersion 比较新旧），但不用
          # GITHUB_RUN_NUMBER：它每次 run 都变，会让 xcodebuild 认为所有 target
          # 的编译参数都变了，DerivedData 缓存无法跳过 app target 的 WMO 编译
          # （实验 D 实测：缓存命中仍要 61:28，大头就是主 target 重编）。
          # 改成「日期 + VERSION 里的修订号」：同一 commit 重跑得到同一个值（缓存可
          # 命中），新版本的修订号递增，依然单调。
          REL_NUM="$(sed -nE 's/^[^-]*-r([0-9]+)$/\1/p' VERSION)"
          if [ -z "${REL_NUM}" ]; then
            echo "::warning::VERSION（$(cat VERSION)）里没有 -rN 修订号，回退到 run_number"
            REL_NUM="${GITHUB_RUN_NUMBER}"
          fi
          CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d)0${REL_NUM}"
          echo "CURRENT_PROJECT_VERSION=${CURRENT_PROJECT_VERSION}" >> "$GITHUB_ENV"

          echo "构建架构：${ARCH}"
          echo "MARKETING_VERSION：${MARKETING}"
          echo "CURRENT_PROJECT_VERSION：${CURRENT_PROJECT_VERSION}（日期 + 修订号 r${REL_NUM}）"

      - name: 缓存 Zig / Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-${{ runner.os }}-${{ hashFiles('ghostty/build.zig.zon', 'Native/*/Cargo.lock', 'Packages/**/Cargo.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: 打印环境信息
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version || true
          zig version || true
          cargo --version || true
          rustup toolchain list || true

      - name: 选择 Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "::error::runner 上没有 Xcode 26，无法构建"
            exit 1
          fi
          echo "使用 ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}"
          xcodebuild -version

      - name: 安装 Metal 工具链
        run: xcodebuild -downloadComponent MetalToolchain

      - name: 安装 Zig 0.16.0（上游要求主次版本必须匹配）
        run: |
          set -euo pipefail
          ZIG_VERSION="0.16.0"
          # ghostty/build.zig.zon 里写的是 minimum_zig_version = "0.16.0"，
          # scripts/ghostty-zig-version.sh 要求主次版本完全一致，所以不能用
          # brew 的 latest（现在是 0.17.x）。
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/.local/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig" version

      - name: 检查 Go（Release 构建的 WireGuard 引擎需要）
        run: |
          if command -v go >/dev/null 2>&1; then
            go version
          else
            brew install go
            go version
          fi

      - name: setup（子模块 / Rust 工具链 / 预编译 GhosttyKit）
        run: ./scripts/setup.sh

      # 统一工作区文件 mtime（Issue #102 的关键一步）：Xcode 的增量构建靠
      # XCBuildData/build.db 记录的文件 mtime 签名。CI 每次 checkout / setup 出来的
      # 源文件 mtime 都是新的，即使内容一模一样，build.db 也会判「全部变过」而全量重编
      # （实验 B 实测：缓存命中 1081MB，构建仍然 75:34，一秒没省）。这里把工作区文件
      # （除 .git 与本地产物目录）的 mtime 固定成 2020-01-01，让两次 run 的签名可比。
      - name: 统一工作区文件 mtime（让 DerivedData 缓存能真正命中）
        run: |
          set -euo pipefail
          STAMP="202001010000"
          find . -path ./.git -prune -o -type f -print0 \
            | xargs -0 touch -t "${STAMP}" 2>/dev/null || true
          echo "工作区文件 mtime 已统一为 ${STAMP}"

      # DerivedData 缓存（Issue #102）：缓存整个 derivedData（含 XCBuildData/build.db，
      # 那是增量判断的核心）。实验 A 测出原始体积 4.8~7.6GB、压缩后约 1.1GB，
      # 在 GitHub 10GB 上限之内。key 用 commit sha（同一 commit 重跑直接命中），
      # restore-keys 前缀匹配最近一次缓存。
      - name: 恢复 DerivedData 缓存
        id: dd-cache
        if: github.event.inputs.cache != 'false'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cmux-build
          key: dd-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dd-${{ runner.os }}-

      - name: 导入签名证书（可选，Issue #121）
        # 只在配了 CMUX_DEV_SIGNING_CERT_P12_BASE64 时执行：没配 = 以前的 ad-hoc 行为，
        # 一步都不跑、构建结果与以前完全一致。配了就**必须**成功——导入失败、身份找不到
        # 都直接让构建红，绝不静默退回 ad-hoc：那等于把 Issue #121 的 bug（TCC 授权
        # 每次重建都失效）又悄悄带回来。
        if: env.CMUX_DEV_SIGNING_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          IDENTITY="${CMUX_DEV_SIGNING_IDENTITY:-cmux Local Code Signing}"
          KEYCHAIN="$RUNNER_TEMP/cmux-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/cmux-signing.p12"
          CERT_PEM="$RUNNER_TEMP/cmux-signing-cert.pem"
          # macOS 的 base64 行为在不同版本间有差异，统一用 openssl 解码。
          printf '%s' "$CMUX_DEV_SIGNING_CERT_P12_BASE64" | openssl base64 -d -A > "$P12"

          # 临时钥匙串：不碰 runner 的登录钥匙串，构建结束随机器一起销毁。
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CMUX_DEV_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign
          # 没有这一步，codesign 取私钥时可能被钥匙串 ACL 挡住（headless 上没人点「允许」）。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null 2>&1 || true
          # 把临时钥匙串加进用户搜索列表（保留原有条目，不要整体覆盖）。
          existing=()
          while IFS= read -r kc; do
            existing+=("$kc")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s ${existing[@]+"${existing[@]}"} "$KEYCHAIN"

          # 自签名证书必须被系统信任为「代码签名」用途，codesign 才认。
          # trustAsRoot 只信任这张证书本身（不是信任整条链），且只影响这台 runner。
          # 优先用 openssl 取 PEM；LibreSSL 读不了新式 PBES2 加密时回退到 security 导出。
          if ! openssl pkcs12 -in "$P12" -clcerts -nokeys \
                 -passin "pass:$CMUX_DEV_SIGNING_CERT_PASSWORD" -out "$CERT_PEM" 2>/dev/null; then
            security find-certificate -c "$IDENTITY" -p "$KEYCHAIN" > "$CERT_PEM"
          fi

          # ==== 诊断块（临时，确定 macOS 26 runner 上 add-trusted-cert 的失败原因）====
          echo "runner macOS: $(sw_vers -productVersion)"
          echo "openssl: $(openssl version)"
          echo "identity: $IDENTITY"
          echo "cert pem bytes: $(wc -c < "$CERT_PEM" | tr -d ' ')"
          echo "cert pem count: $(grep -c 'BEGIN CERTIFICATE' "$CERT_PEM" || true)"
          echo "--- pem head/tail"; head -2 "$CERT_PEM"; tail -2 "$CERT_PEM"
          echo "--- openssl extract 对照"
          openssl pkcs12 -in "$P12" -clcerts -nokeys \
            -passin "pass:$CMUX_DEV_SIGNING_CERT_PASSWORD" -out "$RUNNER_TEMP/openssl-cert.pem"; echo "openssl=$?"
          echo "openssl pem bytes: $(wc -c < "$RUNNER_TEMP/openssl-cert.pem" 2>/dev/null | tr -d ' ' || echo 0)"
          echo "--- find-identity（信任前）"; security find-identity -v -p codesigning || true
          echo "--- list-keychains"; security list-keychains -d user || true
          for variant in "-r trustRoot" "-r trustAsRoot" "-r trustRoot -p codeSign" "-r trustAsRoot -p codeSign"; do
            echo "--- add-trusted-cert $variant"
            # shellcheck disable=SC2086
            sudo security add-trusted-cert -d $variant -k /Library/Keychains/System.keychain "$CERT_PEM"; echo "exit=$?"
            security find-identity -v -p codesigning || true
          done
          echo "--- dump-trust-settings (admin)"; sudo security dump-trust-settings -d 2>&1 | head -20 || true
          # ==== 诊断块结束 ====

          if ! security find-identity -v -p codesigning | grep -qF "\"$IDENTITY\""; then
            echo "::error::导入后仍找不到代码签名身份 \"$IDENTITY\"；确认 CMUX_DEV_SIGNING_IDENTITY 与证书 CN 一致"
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "CMUX_DEV_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "签名身份已就绪：$IDENTITY"

      - name: 构建 Release（本项目正式身份）
        run: |
          set -uo pipefail
          echo "构建身份：cmux（bundle id com.xhqing.cmux）"
          echo "并行度：CMUX_BUILD_JOBS=${CMUX_BUILD_JOBS}"
          echo "缓存命中：${{ steps.dd-cache.outputs.cache-hit }}"
          # 内存峰值采样（Issue #104）：每 5 秒汇总 swift-frontend / clang / xcodebuild
          # 的 RSS。并行度调高后靠这个判断离 OOM 还有多少余量。
          (
            peak=0
            while :; do
              total=$(ps -Ao rss=,comm= 2>/dev/null | awk '/swift-frontend|swiftc|xcodebuild|clang/ {s+=$1} END {printf "%d", s/1024}')
              [ -z "${total:-}" ] && total=0
              [ "$total" -gt "$peak" ] && peak="$total"
              echo "peak=${peak}MB now=${total}MB" > /tmp/build-mem.log
              sleep 5
            done
          ) &
          SAMPLER=$!
          # Keep the full xcodebuild output. GitHub truncates the live step log,
          # so a killed/failed build loses the real error; the artifact from the
          # next step is the only complete record.
          set -o pipefail
          ./scripts/reloads.sh --derived-data /tmp/cmux-build 2>&1 | tee /tmp/cmux-build-raw.log
          STATUS=${PIPESTATUS[0]}
          kill "$SAMPLER" 2>/dev/null || true
          echo "=== 内存峰值采样 ==="
          cat /tmp/build-mem.log 2>/dev/null || echo "（无采样数据）"
          exit "$STATUS"

      - name: 校验产物的签名身份（Issue #121）
        run: |
          set -euo pipefail
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          # 看 designated requirement：ad-hoc 是 cdhash（每次重建都变，TCC 授权随之
          # 失效），证书签名是 certificate leaf（证书不变 → 重建后授权继续有效）。
          REQ="$(codesign -d --requirements - "$APP" 2>&1 || true)"
          echo "$REQ"
          if [ -n "${CMUX_DEV_SIGN_IDENTITY:-}" ]; then
            if echo "$REQ" | grep -q 'cdhash'; then
              echo "::error::产物仍是 ad-hoc 签名（designated requirement 里是 cdhash）：配置的证书没有生效，TCC 授权会继续随每次重建失效"
              exit 1
            fi
            if ! echo "$REQ" | grep -q 'certificate leaf'; then
              echo "::error::designated requirement 里没有 certificate leaf，说明没有用导入的证书签名（期望身份：$CMUX_DEV_SIGN_IDENTITY）"
              exit 1
            fi
            echo "签名身份校验通过：requirement 绑定到证书，重建不再打断 TCC 授权"
          else
            echo "::warning::本次产物是 ad-hoc 签名（未配置 CMUX_DEV_SIGNING_CERT_P12_BASE64）：屏幕录制等 TCC 授权会在每次重新构建后失效，配置方法见 DEVELOPMENT.md 第十节"
          fi

      - name: 校验产物不含构建机 home 路径
        run: |
          set -euo pipefail
          # xhqing/cmux#46：reloads.sh 曾经把 "$HOME/Library/Application Support/cmux/..."
          # 写进 Info.plist 的 LSEnvironment，CI 上 $HOME=/Users/runner，绝对路径被固化
          # 进产物、装到任何用户机器上都不存在。这里对最终产物再断言一次。
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          ./scripts/check-bundle-home-paths.sh "${APP}"

      - name: 校验更新通道（feed / 公钥 / 版本）
        run: |
          set -euo pipefail
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          PLIST="${APP}/Contents/Info.plist"
          EXPECTED_FEED="https://github.com/xhqing/cmux/releases/latest/download/appcast.xml"
          # 本分叉自己的 Sparkle EdDSA 公钥；对应私钥只放在 GitHub secret
          # SPARKLE_PRIVATE_KEY 里（本机备份在 macOS 钥匙串，见 DEVELOPMENT.md 第四节）。
          EXPECTED_SPARKLE_PUBLIC_KEY="rfbvt6jmbne/wfXun8IedZrnp4hR/iRFi9oCPtKsN4Q="
          FEED="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "${PLIST}" || true)"
          AUTO="$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "${PLIST}" || true)"
          KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "${PLIST}" || true)"
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${PLIST}" || true)"
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${PLIST}" || true)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${PLIST}" || true)"
          # 我们自己的发布版本号（带 "-rN" 后缀），About 面板就显示它。
          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          ABOUT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CMUXVersion' "${PLIST}" || true)"
          echo "bundle id : ${BID}"
          echo "version   : ${VER} (build ${BUILD})"
          echo "release   : ${RELEASE_VERSION}（About 面板显示值：${ABOUT_VERSION}）"
          echo "feed      : ${FEED}"
          echo "auto check: ${AUTO}"
          echo "sparkle key: ${KEY}"
          if [ "${BID}" != "com.xhqing.cmux" ]; then
            echo "::error::CFBundleIdentifier=${BID}，应为 com.xhqing.cmux"
            exit 1
          fi
          if [ "${VER}" != "${MARKETING_VERSION}" ]; then
            echo "::error::CFBundleShortVersionString=${VER}，应为 ${MARKETING_VERSION}（VERSION 去后缀）"
            exit 1
          fi
          if [ "${ABOUT_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::CMUXVersion=${ABOUT_VERSION}，应为 ${RELEASE_VERSION}（VERSION 原值，About 面板显示的版本号）"
            exit 1
          fi
          # Sparkle 用 CFBundleVersion 比较新旧版本；CI 传的是「日期 + run 号」的单调数字，
          # 一旦退回工程里写死的 113，后续所有更新都不会被判为「更新」。
          if ! [[ "${BUILD}" =~ ^[0-9]{10,}$ ]]; then
            echo "::error::CFBundleVersion=${BUILD}，不是预期的「日期 + 修订号」单调构建号（CURRENT_PROJECT_VERSION 没传进 xcodebuild？）"
            exit 1
          fi
          if [ "${FEED}" != "${EXPECTED_FEED}" ]; then
            echo "::error::SUFeedURL=${FEED}，应为 ${EXPECTED_FEED}（更新源只认本仓库，不能指向上游）"
            exit 1
          fi
          if [ "${KEY}" != "${EXPECTED_SPARKLE_PUBLIC_KEY}" ]; then
            echo "::error::SUPublicEDKey=${KEY}，应为 ${EXPECTED_SPARKLE_PUBLIC_KEY}；改了公钥必须同步 GitHub secret SPARKLE_PRIVATE_KEY，否则 appcast 签名对不上"
            exit 1
          fi
          if [ "${AUTO}" = "true" ]; then
            echo "::error::SUEnableAutomaticChecks 仍为 true"
            exit 1
          fi

      - name: 校验 bundle 主题库完整（Issue #71）
        run: |
          set -euo pipefail
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          SRC="Resources/ghostty/themes"
          BUNDLED="${APP}/Contents/Resources/ghostty/themes"
          # 主题库经 folder reference（cmux.xcodeproj 里 ghostty-themes）整目录拷进
          # bundle；这里断言拷贝结果与仓库源目录逐文件一致（数量 + 内容），防止
          # 上游同步 / 工程改动让 bundle 主题库悄悄漂移。
          if [ ! -d "${BUNDLED}" ]; then
            echo "::error::bundle 内没有主题库目录 ${BUNDLED}（folder reference 未生效？）"
            exit 1
          fi
          src_count="$(find "${SRC}" -type f | wc -l | tr -d ' ')"
          bundled_count="$(find "${BUNDLED}" -type f | wc -l | tr -d ' ')"
          echo "仓库主题文件数：${src_count}"
          echo "bundle 主题文件数：${bundled_count}"
          if [ "${src_count}" != "${bundled_count}" ]; then
            echo "::error::主题文件数量不一致：仓库 ${src_count} vs bundle ${bundled_count}"
            exit 1
          fi
          diff -r "${SRC}" "${BUNDLED}"
          echo "主题库逐文件一致 ✓"

      - name: 打包
        run: |
          set -euo pipefail
          APP="/tmp/cmux-build/Build/Products/Release/cmux.app"
          VERSION="$(cat VERSION)"
          # 产物名带上真实架构（从二进制里读，不猜输入参数）
          BIN="${APP}/Contents/MacOS/cmux"
          ARCHS_PRESENT="$(lipo -archs "${BIN}" 2>/dev/null | tr ' ' '-' || echo unknown)"
          echo "app 内的架构：${ARCHS_PRESENT}"
          OUT="cmux-${VERSION}-macos-${ARCHS_PRESENT}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${OUT}"
          ls -lh "${OUT}"
          shasum -a 256 "${OUT}" | tee "${OUT}.sha256"

      - name: 生成并签名 appcast（仅 tag 构建）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少 GitHub secret SPARKLE_PRIVATE_KEY，无法给 appcast 签名（app 内更新通道会断掉）"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} 与 VERSION（${VERSION}）不一致，appcast 会指向错的版本"
            exit 1
          fi
          # 先确认 secret 里的私钥与 app 里的公钥是同一对，否则生成的签名 Sparkle 会拒绝。
          EXPECTED_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' /tmp/cmux-build/Build/Products/Release/cmux.app/Contents/Info.plist)"
          DERIVED_KEY="$(swift scripts/derive_sparkle_public_key.swift "${SPARKLE_PRIVATE_KEY}")"
          if [ "${DERIVED_KEY}" != "${EXPECTED_KEY}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY 对应的公钥（${DERIVED_KEY}）与 app 的 SUPublicEDKey（${EXPECTED_KEY}）不一致"
            exit 1
          fi
          ZIP="$(find . -maxdepth 1 -name 'cmux-*.zip' -type f -print -quit)"
          if [ -z "${ZIP}" ]; then
            echo "::error::找不到要签名的 cmux-*.zip"
            exit 1
          fi
          DOWNLOAD_URL_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
          RELEASE_NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            ./scripts/sparkle_generate_appcast.sh "${ZIP}" "${TAG}" appcast.xml
          # 显示版本用 VERSION 原值（带 -rN），否则更新提示会把 r18 显示成旧基线版本号。
          python3 scripts/ci/set-appcast-version.py appcast.xml "${VERSION}"
          ls -lh appcast.xml
          grep -qF "releases/download/${TAG}/$(basename "${ZIP}")" appcast.xml

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cmux-xhqing-${{ github.run_number }}-${{ github.event.inputs.arch || 'arm64' }}
          path: |
            cmux-*.zip
            cmux-*.zip.sha256
            appcast.xml
          if-no-files-found: error
          retention-days: 30

      # 体积实测（Issue #102）：普通仓库的 GitHub 缓存上限是 10GB，超了会互相淘汰。
      # 先把整个 derivedData 与三个子目录的体积打进日志，再决定缓存粒度。
      - name: 测量 DerivedData 体积
        if: always()
        run: |
          set -uo pipefail
          echo "--- 总体积 ---"
          du -sh /tmp/cmux-build 2>/dev/null || echo "（不存在）"
          echo "--- 分项 ---"
          for d in Build/Intermediates.noindex Build/Products ModuleCache.noindex; do
            if [ -d "/tmp/cmux-build/$d" ]; then du -sh "/tmp/cmux-build/$d"; else echo "$d 不存在"; fi
          done

      # 只在 main / tag / 手动 dispatch 上写缓存：普通分支也写的话，10GB 上限很快
      # 把有用的旧条目挤掉（dispatch 包含在内是为了实验能验证「命中后有多快」）。
      - name: 保存 DerivedData 缓存
        if: success() && github.event.inputs.cache != 'false' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: /tmp/cmux-build
          key: dd-${{ runner.os }}-${{ github.sha }}

      # cmuxTests 不在这里跑：它已拆到 .github/workflows/unit-tests.yml 独立执行
      # （xhqing/cmux#93）。测试的 TestAction 是 Debug 配置，与这里 Release 构建不共用
      # 产物，整套重编（90 分钟量级）再叠加 XCTest 与 Swift Testing，实测 200 分钟以上；
      # 留在本 workflow 里会让 `workflow_run: completed` 迟迟不触发，
      # `attach-release-asset` 也就挂不上资产。现在本 workflow 只负责构建与出包（约 86 分钟），
      # 结束后资产立即挂上；测试并行跑、失败独立标红，不再拖住安装包。

      - name: 上传完整构建日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/cmux-build-raw.log
          if-no-files-found: warn
          retention-days: 7

      - name: 收尾（关掉构建脚本顺手拉起的实例）
        if: always()
        run: |
          pkill -f "/tmp/cmux-build/Build/Products/Release/cmux.app/Contents/MacOS/cmux" || true
          exit 0
