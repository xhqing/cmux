name: unit-tests

# cmuxTests 的独立执行通道（xhqing/cmux#93）。
#
# 为什么不放在 build-macos 里：`cmux-unit` 的 TestAction 是 Debug，与 Release
# 构建配置不同，共用 derivedData 仍要整套重编（实测 90 分钟量级）；再叠加 XCTest
# 4112 条（约 20 分钟）与 Swift Testing 那一套（实测 87 分钟以上仍未跑完），整条
# step 远超 180 分钟。它一旦留在构建 workflow 里，`workflow_run: completed` 就要等到
# 测试结束才触发，`attach-release-asset` 也就挂不上资产（r22、r23 就是这么空掉的）。
#
# 拆出来之后：build-macos 约 86 分钟结束 → 资产立即挂到 Release；本 workflow 与它
# 并行跑，失败只标红自己，不影响安装包是否可安装。
#
# 触发：推 tag（与 build-macos 同步启动），或手动 dispatch 在任意分支上验证。
#
# 维护提示：本文件里「选择 Xcode / Metal / Zig / Go / setup」几段与 build.yml 的同名
# 步骤同源，改动任一处时请对照另一处，避免两条流水线跑在不同工具链上。

on:
  push:
    tags:
      - "v*-r[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests (cmuxTests)
    runs-on: macos-26
    # Debug 全套重编约 90 分钟 + XCTest 约 20 分钟 + Swift Testing 90 分钟以上，
    # 给足 360 分钟让它跑完再判红绿（不再用「猜一个超时」挡住结果）。
    timeout-minutes: 360
    env:
      CMUX_DEV_BACKEND_MODE: local
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      COMPILER_INDEX_STORE_ENABLE: "NO"

    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 缓存 Zig / Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-${{ runner.os }}-${{ hashFiles('ghostty/build.zig.zon', 'Native/*/Cargo.lock', 'Packages/**/Cargo.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: 打印环境信息
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version || true
          zig version || true
          cargo --version || true

      - name: 选择 Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "::error::runner 上没有 Xcode 26，无法跑测试"
            exit 1
          fi
          echo "使用 ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}"
          xcodebuild -version

      - name: 安装 Metal 工具链
        run: xcodebuild -downloadComponent MetalToolchain

      - name: 安装 Zig 0.16.0（上游要求主次版本必须匹配）
        run: |
          set -euo pipefail
          ZIG_VERSION="0.16.0"
          # ghostty/build.zig.zon 里写的是 minimum_zig_version = "0.16.0"，
          # scripts/ghostty-zig-version.sh 要求主次版本完全一致，所以不能用
          # brew 的 latest（现在是 0.17.x）。
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/.local/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig" version

      - name: 检查 Go（Release 构建的 WireGuard 引擎需要）
        run: |
          if command -v go >/dev/null 2>&1; then
            go version
          else
            brew install go
            go version
          fi

      - name: setup（子模块 / Rust 工具链 / 预编译 GhosttyKit）
        run: ./scripts/setup.sh

      - name: 运行 cmuxTests
        id: unit_tests
        # 这一 step 失败不直接判红：下一步只重跑失败的用例，用来区分 headless 时序
        # 噪声与真回归（MUST：不这么做，恢复性判定就没有落点）。
        continue-on-error: true
        # step 级超时：job 级 360 分钟太远，一条挂死的用例曾烧掉 4 小时才被取消
        # （run 44703813508，T13）。正常全量 20~25 分钟，180 分钟是 7 倍余量；
        # 真挂住时在这里快速失败，不必等 job 上限。
        timeout-minutes: 180
        # 保留完整输出：xcodebuild 的测试输出很长，GitHub 会截断实时日志，
        # 失败时只能靠下一行的 artifact 定位具体是哪条用例。
        #
        # headless runner 上「不可信」的分组用 -skip-testing 排除（见 #98 与
        # DEVELOPMENT.md 9.4）：这些用例要么需要真实窗口服务器 / 键盘事件，
        # 要么需要登录账号与 Cloud / 模拟器环境。它们在 runner 上会稳定失败，
        # 红了不代表代码坏了；本机用 scripts/test-all-local.sh 仍会跑全量。
        run: |
          set -euo pipefail
          SKIP=(
            cmuxTests/AppDelegateShortcutRoutingTests
            cmuxTests/WorkspaceManualUnreadTests
            cmuxTests/BrowserDeveloperToolsVisibilityPersistenceTests
            cmuxTests/MainWindowCloseConfirmationTests
            cmuxTests/TabManagerCloseCurrentPanelTests
            cmuxTests/TabManagerCloseDontAskAgainTests
            cmuxTests/TabManagerWarnBeforeClosingWorkspaceTests
            cmuxTests/TabManagerCloseCurrentTabSpamTests
            cmuxTests/TerminalNotificationDirectInteractionTests
            cmuxTests/CLINotifyProcessIntegrationRegressionTests
            cmuxTests/CMUXOpenCommandTests
            cmuxTests/WorkspacePullRequestSidebarTests
            cmuxTests/SurfacePaneFactoryFocusTests
            cmuxTests/SimulatorPanelIntegrationTests
            cmuxTests/QuitConfirmationAlertPresenterTests
            cmuxTests/EmptyWindowStateTests
            cmuxTests/MainWindowCloseTerminationRoutingTests
            cmuxTests/GhosttyKeyEquivalentRegressionTests
            cmuxTests/MarkdownPanelTests/testMarkdownRenderAutoLoadsRemoteImagesWhenEnabled
            # 第二轮（#98 实测 44244882707）：下面 26 个 suite 同样依赖窗口服务器 / 键盘事件 /
            # 远端 tmux 会话，第一轮漏掉，在 CI 上稳定失败。
            cmuxTests/RemoteTmuxMirrorCLIObservabilityTests
            cmuxTests/RemoteTmuxMirrorSplitRoutingTests
            cmuxTests/RemoteTmuxMirrorCloseDetachTests
            cmuxTests/RemoteTmuxNewWindowWorkingDirectoryResolutionTests
            cmuxTests/AppDelegateEqualizeSplitsShortcutTests
            cmuxTests/AppDelegateSurfaceShortcutRoutingTests
            cmuxTests/AppDelegateOptionDigitShortcutRoutingTests
            cmuxTests/AppDelegateRenameShortcutContextTests
            cmuxTests/WorkspaceCloseTabsContextMenuTests
            cmuxTests/GlobalSearchShortcutBehaviorTests
            cmuxTests/GlobalSearchInputOwnershipTests
            cmuxTests/GlobalSearchShortcutPriorityTests
            cmuxTests/CanvasShortcutRoutingFeedbackTests
            cmuxTests/SessionContentWidthSettingsFileStoreTests
            cmuxTests/TerminalWindowPortalCommittedGeometryTests
            cmuxTests/TextBoxEscapePassthroughTests
            cmuxTests/PaneResizeShortcutTests
            cmuxTests/SidebarEmptyAreaNewWorkspaceActionTests
            cmuxTests/AgentNotificationRegressionTests
            cmuxTests/GhosttyWorkspaceActionTests
            cmuxTests/KeyboardShortcutSettingsObserverTests
            cmuxTests/MainWindowFocusRestoreTests
            cmuxTests/CloudSCPIntegrationTests
            cmuxTests/MobilePanelArtifactResolutionTests
            cmuxTests/NarrowWindowSidePanelFitTests
            # 第三轮（#98 实测 44262621179）：下面 11 条是最后一组环境相关失败
            # （WebKit JS 在 headless 下抛异常、媒体播放器无音频设备、窗口与
            # 无障碍输入自动化、远端 tmux 焦点与拓扑）。
            cmuxTests/AccessibilityInsertTextRegressionTests
            cmuxTests/ReopenLastClosedTests
            cmuxTests/WorkspaceGroupCycleShortcutTests
            cmuxTests/WorkspaceGroupNumberedSelectionTests
            cmuxTests/AppDelegateTerminalTypingShortcutFastPathTests
            cmuxTests/FilePreviewNativeRefreshStateTests
            cmuxTests/MarkdownKaTeXTests
            cmuxTests/RemoteTmuxMirrorFocusPolicyTests
            cmuxTests/RemoteTmuxMirrorTopTopologyTests
            cmuxTests/SidebarFileDropFindRoutingTests
            cmuxTests/SidebarNewLocalWorkspaceTests
            # 第四轮（#98 实测 44282048095）：XCTest 已 0 失败，只剩这一个 suite——
            # 侧边栏隐藏/显示时的 AppKit 表格行数、Cloud 行与焦点边界断言。
            cmuxTests/SidebarHiddenPresentationTests
            # 第五轮（2026-11-23，run 45157271886）：这条用例靠「presenter 的有界
            # run-loop 等待期间、50ms Timer 关窗」来制造竞态，headless runner 上该
            # Timer 不一定在泵里触发（实测直接拿到 .presented）。同一族里还有别的
            # 窗口展示契约用例，整组都需要真实窗口服务器 / 运行循环时序，交给本机
            # `scripts/test-all-local.sh`（有 GUI 会话）跑。
            cmuxTests/SettingsWindowPresentationContractTests
            # 第六轮（2026-11-23，run 45181479936）：`remoteManualInputPreservesLiteralAndNamedKeyOrder`
            # 断言「x → End → y」三条 send-keys 的**到达顺序**；同一轮两次都红，而上一轮
            # （run 45157271886）它是绿的——输入事件的投递顺序在 headless runner 上不稳定。
            # 与上面已被排除的 RemoteTmuxMirror* 分组同类，整组交给本机 GUI 会话跑。
            cmuxTests/RemoteTmuxMirrorPaneInputMappingTests
          )
          ARGS=()
          for suite in "${SKIP[@]}"; do ARGS+=("-skip-testing:${suite}"); done
          echo "跳过 ${#SKIP[@]} 个 headless 不可信分组"
          # 别加 `-retry-tests-on-failure -test-iterations 2`：实测（run 45181479936）
          # 它把**每个**用例都跑两遍（9465→18930 条、测试阶段 1985 秒→4223 秒），
          # 并没有「只重跑失败的」，也没把 headless 时序噪声变成绿。要「只重跑失败
          # 用例」得自己解析失败清单再用 `-only-testing:` 二次调用，那是另一件事
          # （T13 的待办），不要指望 xcodebuild 的这两面旗。
          rm -rf /tmp/cmux-tests.xcresult
          set +e
          xcodebuild test \
            -project cmux.xcodeproj \
            -scheme cmux-unit \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath /tmp/cmux-build \
            -only-testing:cmuxTests \
            -resultBundlePath /tmp/cmux-tests.xcresult \
            "${ARGS[@]}" 2>&1 | tee /tmp/cmux-tests-raw.log
          status=${PIPESTATUS[0]}
          echo "xcodebuild 退出码：${status}"
          exit "${status}"

      - name: 失败用例二次调用（只重跑失败的用例，区分噪声与回归）
        # 首轮红时只重跑失败的用例：通过 → headless 时序噪声（绿 + warning，清单进
        # job summary）；仍失败或选择器选不中 → 真回归（红）。选择器先按测试级试，
        # 选不中再退回 suite 级一次，最后仍不成立就判红——绝不把 0 tests 当通过。
        # 提取器：scripts/ci/rerun_failed_unit_tests.py（T13）。
        if: steps.unit_tests.outcome == 'failure'
        timeout-minutes: 60
        run: |
          set -uo pipefail
          # GitHub 用 `bash -e` 跑 run 块：不关掉它，任何一条（含被重定向掉输出的）命令
          # 失败都会静默退出 1。这里全部显式判退出码并打印原因。
          set +e

          python3 --version
          echo "首个 xcresult 目录：$( [ -d /tmp/cmux-tests.xcresult ] && echo present || echo missing )"
          echo "原始日志大小：$(wc -c < /tmp/cmux-tests-raw.log 2>/dev/null || echo missing)"

          xcresult_json=/tmp/cmux-tests-xcresult.json
          if [ -d /tmp/cmux-tests.xcresult ]; then
            if ! xcrun xcresulttool get test-results tests \
              --path /tmp/cmux-tests.xcresult --format json > "${xcresult_json}" 2>/tmp/xcresult-error.log; then
              echo "::warning::xcresulttool 解析失败，退回只看日志"
              head -n 20 /tmp/xcresult-error.log || true
            fi
          fi

          # 自检：提取器的 fixture 断言在 runner 的 python3 上也要过。
          python3 scripts/tests/test_rerun_failed_unit_tests.py > /tmp/rerun-parser-selftest.log 2>&1
          selftest_status=$?
          echo "提取器自检退出码：${selftest_status}"
          tail -n 5 /tmp/rerun-parser-selftest.log || true
          if [ "${selftest_status}" -ne 0 ]; then
            echo "::error::提取器的 fixture 断言在这台 runner 上没过（退出码 ${selftest_status}）：按真回归处理。"
            exit 1
          fi

          parse_args=(--log /tmp/cmux-tests-raw.log --explain)
          if [ -s "${xcresult_json}" ]; then
            echo "xcresult JSON 大小：$(wc -c < "${xcresult_json}")"
            parse_args+=(--xcresult-json "${xcresult_json}")
          else
            echo "没有可用的 xcresult JSON，退回只看日志"
          fi
          ids="$(python3 scripts/ci/rerun_failed_unit_tests.py "${parse_args[@]}" 2>/tmp/rerun-parse.log)"
          parse_status=$?
          echo "提取器退出码：${parse_status}"
          cat /tmp/rerun-parse.log || true
          if [ "${parse_status}" -ne 0 ] || [ -z "${ids}" ]; then
            echo "::error::首轮失败，但没能提取出失败用例（解析退出码 ${parse_status}）：按真回归处理，不做猜测。"
            exit 1
          fi

          selectors=()
          while IFS= read -r identifier; do
            [ -n "${identifier}" ] && selectors+=("${identifier}")
          done <<< "${ids}"
          printf '%s\n' "${selectors[@]}" > /tmp/cmux-tests-failed.txt
          echo "首轮失败的用例："
          printf '  - %s\n' "${selectors[@]}"

          # 只跑给定选择器；返回 xcodebuild 的退出码。
          run_selected() {
            local tag="$1"; shift
            local -a args=()
            local identifier
            for identifier in "$@"; do
              args+=("-only-testing:${identifier}")
            done
            rm -rf "/tmp/cmux-tests-rerun-${tag}.xcresult"
            echo "::group::二次调用（${tag}）"
            printf '  - %s\n' "$@"
            xcodebuild test \
              -project cmux.xcodeproj \
              -scheme cmux-unit \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath /tmp/cmux-build \
              -resultBundlePath "/tmp/cmux-tests-rerun-${tag}.xcresult" \
              "${args[@]}" 2>&1 | tee "/tmp/cmux-tests-rerun-${tag}.log"
            local status=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "二次调用（${tag}）退出码：${status}"
            return "${status}"
          }

          # 证明每个选择器都真的选中了用例：0 tests 也会 exit 0（canary 已实测），嵌套 suite
          # 的真实标识又和文件名不同，所以必须用重跑自己的 xcresult 校验。
          verify_selected() {
            local tag="$1"; shift
            local json="/tmp/cmux-tests-rerun-${tag}-xcresult.json"
            if ! xcrun xcresulttool get test-results tests \
              --path "/tmp/cmux-tests-rerun-${tag}.xcresult" --format json > "${json}" 2>"/tmp/xcresult-rerun-${tag}-error.log"; then
              echo "::error::二次调用（${tag}）通过但读不出它的 xcresult，无法确认选择器选中了用例。"
              head -n 20 "/tmp/xcresult-rerun-${tag}-error.log" || true
              return 1
            fi
            local -a args=(--executed-xcresult-json "${json}")
            local identifier
            for identifier in "$@"; do
              args+=(--select "${identifier}")
            done
            python3 scripts/ci/rerun_failed_unit_tests.py "${args[@]}" > /dev/null 2>"/tmp/rerun-guard-${tag}.log"
            local status=$?
            echo "选择器校验（${tag}）退出码：${status}"
            if [ "${status}" -ne 0 ]; then sed 's/^/  /' "/tmp/rerun-guard-${tag}.log"; fi
            return "${status}"
          }

          # macOS runner 的 /bin/bash 是 3.2：没有 mapfile；也别让未初始化的数组在 set -u
          # 下把流程带进「成功」分支（本地桩件实测过这条假绿路径）。
          verified=0
          final=()
          run_selected exact "${selectors[@]}"
          exact_status=$?
          guard_status=99
          if [ "${exact_status}" -eq 0 ]; then
            verify_selected exact "${selectors[@]}"
            guard_status=$?
            if [ "${guard_status}" -eq 0 ]; then
              final=("${selectors[@]}")
              verified=1
            fi
          fi

          # 测试级选择器选不中时，退回「它所在的 suite」再试一次（仍只跑相关 suite）。
          if [ "${verified}" -ne 1 ]; then
            echo "::warning::测试级选择器没能确认（重跑退出码 ${exact_status} / 选择器校验 ${guard_status}），退回 suite 级再试。"
            coarsen_args=(--coarsen-to-suite)
            for identifier in "${selectors[@]}"; do
              coarsen_args+=(--select "${identifier}")
            done
            suite_list="$(python3 scripts/ci/rerun_failed_unit_tests.py "${coarsen_args[@]}")"
            coarsen_status=$?
            echo "粗化退出码：${coarsen_status}"
            suites=()
            while IFS= read -r suite; do
              [ -n "${suite}" ] && suites+=("${suite}")
            done <<< "${suite_list}"
            if [ "${coarsen_status}" -ne 0 ] || [ "${#suites[@]}" -eq 0 ]; then
              echo "::error::无法把选择器粗化到 suite（退出码 ${coarsen_status}）：按真回归处理。"
              exit 1
            fi
            run_selected suite "${suites[@]}"
            suite_status=$?
            if [ "${suite_status}" -ne 0 ]; then
              echo "::error::二次调用（suite 级）仍失败（退出码 ${suite_status}）：按真回归处理。"
              tail -n 120 /tmp/cmux-tests-rerun-suite.log || true
              exit 1
            fi
            verify_selected suite "${suites[@]}"
            suite_guard=$?
            if [ "${suite_guard}" -ne 0 ]; then
              echo "::error::suite 级二次调用通过，但仍有选择器没选中用例：按真回归处理。"
              exit 1
            fi
            final=("${suites[@]}")
            verified=1
          fi

          if [ "${verified}" -ne 1 ] || [ "${#final[@]}" -eq 0 ]; then
            echo "::error::没有任何一次二次调用通过校验：按真回归处理。"
            exit 1
          fi

          echo "::warning::首轮失败的用例在二次调用里全部通过：按 headless 时序噪声处理（清单见 job summary）。"
          {
            echo "### 首轮失败、重跑通过（时序噪声）"
            echo ""
            printf -- '- \`%s\`\n' "${final[@]}"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 0
      - name: 上传测试日志（始终上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log-${{ github.run_number }}
          path: |
            /tmp/cmux-tests-raw.log
            /tmp/cmux-tests-rerun.log
            /tmp/cmux-tests-failed.txt
            /tmp/rerun-parse.log
            /tmp/rerun-parser-selftest.log
            /tmp/rerun-guard.log
            /tmp/xcresult-error.log
            /tmp/xcresult-rerun-error.log
          if-no-files-found: warn
          retention-days: 14
